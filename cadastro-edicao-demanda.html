<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro/Edição de Demandas</title>
    <link rel="stylesheet" href="cedstyle.css">
</head>
<!-- feito por matthius schultheis-->
<body>
    <div class="cabecalho">

        <h1 class="logo">Cadastro e Edição de Demandas</h1>

    </div>

    <form>
        <div class="linha linha-completa">
            <label>Titúlo</label>
            <input placeholder="Titúlo da demanda">
        </div>
        <div class="linha linha-completa">
            <label>Descrição</label>
            <textarea placeholder="Pequena descrição da demanda"></textarea>
        </div>
        <div class="linha">
            <label>Tipo da demanda</label>
            <select>
                <option>Tarefa</option>
                <option>Defeito</option>
                <option>Melhoria</option>
                <option>Documentação</option>
            </select>
        </div>
        <div class="linha">
            <label>Prioridade</label>
            <select>
                <option>Crítica</option>
                <option>Alta</option>
                <option>Média</option>
                <option>Baixa</option>
            </select>
        </div>
        <div class="linha">
            <label>Status</label>
            <select>
                <option>Aberta</option>
                <option>Em andamento</option>
                <option>Em revisão</option>
                <option>Concluída</option>
                <option>Cancelada</option>
            </select>
        </div>
        <div class="linha">
            <label>Projeto associado</label>
            <input placeholder="Nome do projeto">
        </div>
        <div class="linha">
            <label>Responsável</label>
            <input placeholder="Nome do responsável">
        </div>
        <div class="linha">
            <label>Prazo de finalização</label>
            <input type="date">
        </div>
        <div class="linha">
            <input type="submit" value="Enviar">
            <input type="reset" value="Reiniciar">
        </div>
    </form>
</body>
</html>
