<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro/Edição de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="ced-style.css" rel="stylesheet">
    <script src="ced-script.js" defer></script>
</head>
<!-- feito por matthius schultheis-->
<body>
    <div class="cabecalho">

        <h1 class="logo">Cadastro e Edição de Demandas</h1>

    </div>

    <form id="formCadastro">
        <div class="linha linha-completa">
            <label for="titulo">Titúlo</label>
            <input id="titulo" placeholder="Titúlo da demanda">
            <div id="erroTitulo" class="invalid-feedback"></div>
        </div>
        <div class="linha linha-completa">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Pequena descrição da demanda"></textarea>
            <div id="erroDescricao" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="demanda">Tipo da demanda</label>
            <select id="demanda">
                <option>Selecione</option>
                <option>Tarefa</option>
                <option>Defeito</option>
                <option>Melhoria</option>
                <option>Documentação</option>
            </select>
            <div id="erroDemanda" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
                <option>Selecione</option>
                <option>Crítica</option>
                <option>Alta</option>
                <option>Média</option>
                <option>Baixa</option>
            </select>
            <div id="erroPrioridade" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="status">Status</label>
            <select id="status">
                <option>Selecione</option>
                <option>Aberta</option>
                <option>Em andamento</option>
                <option>Em revisão</option>
                <option>Concluída</option>
                <option>Cancelada</option>
            </select>
            <div id="erroStatus" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="projeto">Projeto associado</label>
            <input id="projeto" placeholder="Nome do projeto">
            <div id="erroProjeto" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="responsavel">Responsável</label>
            <input id="responsavel" placeholder="Nome do responsável">
            <div id="erroResponsavel" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <label for="prazo">Prazo de finalização</label>
            <input id="prazo" type="date">
            <div id="erroPrazo" class="invalid-feedback"></div>
        </div>
        <div class="linha">
            <input type="submit" value="Enviar">
            <input type="reset" value="Reiniciar">
        </div>
    </form>
    <section id="painelResultado" class="mt-4 d-none">
        <div class="alert alert-success">
            Dados validados.
        </div>
        <h2 class="h4">Objeto convertido em JSON</h2>
        <pre id="resultado" class="bg-dark text-light p-3 rounded"></pre>
    </section>
</body>
</html>
